# Solution de secours : si JarvisApp.xcodeproj ne s'ouvre pas (Xcode < 16),
# installez XcodeGen (brew install xcodegen) puis lancez « xcodegen » dans ce dossier.
name: JarvisApp
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  Jarvis:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Jarvis]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        NSMicrophoneUsageDescription: JARVIS utilise le micro pour comprendre vos commandes vocales.
        NSSpeechRecognitionUsageDescription: JARVIS transforme votre voix en texte pour exécuter vos commandes.
        NSLocationWhenInUseUsageDescription: JARVIS utilise votre position pour vous donner la météo de l'endroit où vous êtes.
        NSLocationUsageDescription: JARVIS utilise votre position pour vous donner la météo de l'endroit où vous êtes.
        NSLocalNetworkUsageDescription: JARVIS se connecte à votre PC sur le réseau local pour le piloter.
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monnom.jarvis
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
